spring.application.name=demo4
server.port=${PORT:8080}

# Cấu hình kết nối MySQL hỗ trợ biến môi trường linh hoạt (tự động tạo database nếu chưa có)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finance_managent?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=

# Khóa bí mật ký JWT Token (có thể ghi đè bằng biến môi trường JWT_SECRET khi deploy)
jwt.secret=

# Cấu hình Hibernate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=false

# OCR Microservice Configuration
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8001}
file.upload-dir=${FILE_UPLOAD_DIR:uploads/receipts}

# File and payload limits
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Cấu hình Spring Mail gửi mã OTP (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Cấu hình Google OAuth2 (Google Client ID lấy từ Google Cloud Console)
google.client-id=${GOOGLE_CLIENT_ID:400677255989-0nu901sd78pi09e8jmjgt48756ds52a4.apps.googleusercontent.com}
